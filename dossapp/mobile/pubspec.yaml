publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  intl: ^0.20.2
  path_provider: ^2.1.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  firebase_crashlytics: ^5.2.4
  flutter_local_notifications: ^20.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
